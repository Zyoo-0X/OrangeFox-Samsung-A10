# Generated by ZooyLyy Tool - OrangeFox build workflow for a10
# Run it from: GitHub > Actions > "Build OrangeFox (a10)" > Run workflow
name: Build OrangeFox (a10)

on:
  workflow_dispatch:
    inputs:
      fox_branch:
        description: "OrangeFox branch (9.0 / 10.0 / 11.0 / 12.1)"
        required: true
        default: "11.0"
      build_target:
        description: "recoveryimage = device has a recovery partition, bootimage = recovery is inside boot"
        required: true
        type: choice
        default: "recoveryimage"
        options:
          - recoveryimage
          - bootimage

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl rsync aria2 python3 python-is-python3
          git clone --depth 1 https://gitlab.com/OrangeFox/misc/scripts "$HOME/fox_scripts"
          cd "$HOME/fox_scripts"
          sudo bash setup/android_build_env.sh
          mkdir -p "$HOME/bin"
          if ! command -v repo >/dev/null 2>&1; then
            curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
            chmod a+x "$HOME/bin/repo"
          fi
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync OrangeFox sources
        env:
          FOX_BRANCH: ${{ inputs.fox_branch }}
        run: |
          git clone --depth 1 https://gitlab.com/OrangeFox/sync.git "$HOME/fox_sync"
          cd "$HOME/fox_sync"
          # sync boleh gagal sebab network, jadi cuba sehingga 3 kali
          for i in 1 2 3; do
            ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$GITHUB_WORKSPACE/fox" && break
            echo "Sync attempt $i failed, retrying in 15s..."
            sleep 15
          done
          cd "$GITHUB_WORKSPACE/fox" || { echo "::error::Sync folder was not created"; exit 1; }
          if [ ! -f build/envsetup.sh ] && [ -d .repo ]; then
            repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags || true
          fi
          if [ ! -f build/envsetup.sh ]; then
            echo "::error::OrangeFox sync did not produce build/envsetup.sh - see the log above"
            ls -la "$GITHUB_WORKSPACE/fox" || true
            exit 1
          fi

      - name: Add device tree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fox/device/samsung/a10"
          rsync -a --exclude=".git" --exclude=".github" \
            "$GITHUB_WORKSPACE/device_tree/" "$GITHUB_WORKSPACE/fox/device/samsung/a10/"

      - name: Build OrangeFox
        env:
          BUILD_TARGET: ${{ inputs.build_target }}
        run: |
          cd "$GITHUB_WORKSPACE/fox"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=a10
          export LC_ALL="C"
          source build/envsetup.sh
          if [ -f "device/samsung/a10/vendorsetup.sh" ]; then
            source "device/samsung/a10/vendorsetup.sh"
          fi
          lunch twrp_a10-eng
          mka adbd "$BUILD_TARGET" -j"$(nproc --all)"

      - name: Collect output
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out_files"
          cd "$GITHUB_WORKSPACE/fox/out/target/product/a10"
          for f in recovery.img boot.img OrangeFox-*.zip; do
            [ -f "$f" ] || continue
            cp -v "$f" "$GITHUB_WORKSPACE/out_files/"
          done
          ls -lh "$GITHUB_WORKSPACE/out_files"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-a10-${{ github.run_number }}
          path: out_files/*
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orangefox-a10-${{ github.run_number }}
          name: OrangeFox a10 build ${{ github.run_number }}
          files: out_files/*
